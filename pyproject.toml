[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "officeflow"
version = "0.1.0"
description = "Offline-first office automation for Excel, PDF and Word documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
officeflow = "officeflow.__main__:main"

[tool.setuptools.packages.find]
include = ["officeflow*"]

[tool.setuptools.package-data]
officeflow = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
