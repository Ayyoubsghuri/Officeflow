[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "officeflow"
version = "0.3.1"
description = "Offline-first office automation for Excel, PDF and Word documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "anthropic>=2.8",          # optional AI assistant: Claude
    "openai>=3.50",            # optional AI assistant: OpenAI
    # Native frameless window (WebView2 on Windows). Without it OfficeFlow opens in the browser.
    "pywebview>=5.0; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
officeflow = "officeflow.__main__:main"

[tool.setuptools.packages.find]
include = ["officeflow*"]

[tool.setuptools.package-data]
officeflow = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
